server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # No `types { }` block here: in nginx it replaces the whole default MIME map, and index.html was then served
    # as application/octet-stream (the browser downloaded the page). nginx's mime.types already maps .wasm.

    location = /agent {
        return 301 /agent/;
    }

    location /agent/ {
        try_files $uri $uri/ /agent/index.html;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Never cache the entry files so a rebuild is picked up immediately.
    location ~ (index\.html|flutter_bootstrap\.js|flutter_service_worker\.js)$ {
        add_header Cache-Control "no-cache";
    }
}
