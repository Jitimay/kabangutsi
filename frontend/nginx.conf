server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    types {
        application/wasm wasm;
    }

    location = /agent {
        return 301 /agent/;
    }

    location /agent/ {
        try_files $uri $uri/ /agent/index.html;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Never cache the entry files so a rebuild is picked up immediately.
    location ~ (index\.html|flutter_bootstrap\.js|flutter_service_worker\.js)$ {
        add_header Cache-Control "no-cache";
    }
}
